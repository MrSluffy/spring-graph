[versions]
# JDK used to build and test; the processor itself targets java-release so it loads in older javac.
java-toolchain = "21"
java-release = "17"

spring = "7.0.10"
spring-boot = "4.1.2"
jakarta-annotation = "3.0.0"
junit = "6.1.3"
compile-testing = "0.24.0"
lombok = "1.18.38"

# Formatting (Spotless)
spotless = "8.11.0"
palantir-java-format = "2.103.0"
ktlint = "1.8.0"

# Publishing. 0.34.x is the newest line that supports Gradle 8 (0.36+ needs Gradle 9); it uploads via the Central Portal.
maven-publish = "0.37.0"
# IntelliJ plugin (springgraph-intellij, a separate Gradle build). The platform version is in its gradle.properties.
intellij-platform = "2.20.1"
junit4 = "4.13.2"
opentest4j = "1.3.0"

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }

[libraries]
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# JUnit: versions come from the BOM
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Spring Boot (examples/pilot-boot): versions come from the Boot BOM
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
h2 = { module = "com.h2database:h2" }
# IntelliJ platform tests run on JUnit 4
junit4 = { module = "junit:junit", version.ref = "junit4" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
