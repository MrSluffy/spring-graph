name: CI

on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gradle build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Validates gradle-wrapper.jar against Gradle's published checksums (validate-wrappers defaults to true in this
      # version). The downloaded distribution is checked by distributionSha256Sum in gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The repository may record gradlew without the executable bit (committed from Windows).
      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # Compiler tests, Spring-agreement tests, construction experiment, and the examples
      # (compiled with the processor in strict mode, plus the pilot's context-startup test).
      # On Windows the default shell is PowerShell, which resolves ./gradlew to gradlew.bat.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  maven-consumer:
    name: Maven + Lombok consumer on Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java 21 builds and publishes the processor locally.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Publish processor to Maven local
        run: ./gradlew :springgraph-processor:publishToMavenLocal --console=plain

      # The Maven steps below consume exactly the version just published (single source: gradle.properties).
      - name: Read project version
        run: echo "SG_VERSION=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_ENV"

      # Java 17, the oldest supported consumer JDK, for every Maven step below (sets JAVA_HOME and PATH).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Valid project compiles in strict mode
        working-directory: examples/maven-lombok
        run: |
          mvn -B -ntp --version | tee maven-version.txt
          grep -q 'Java version: 17\.' maven-version.txt || { echo "::error::Maven is not running on Java 17"; exit 1; }
          rm maven-version.txt
          mvn -B -ntp clean compile -Dspringgraph.version="$SG_VERSION"
          grep -q "Coverage: 3 of 3 dependencies statically validated" target/classes/META-INF/springgraph/graph.txt

      - name: Seeded missing binding fails the build with SG001
        working-directory: examples/maven-lombok
        run: |
          mvn -B -ntp --version | grep -q 'Java version: 17\.' || { echo "::error::Maven is not running on Java 17"; exit 1; }
          mkdir -p src/main/java/seed
          echo 'package seed; public interface Notifier {}' > src/main/java/seed/Notifier.java
          echo 'package seed; @org.springframework.stereotype.Service @lombok.RequiredArgsConstructor public class NotifyService { private final Notifier notifier; }' > src/main/java/seed/NotifyService.java
          if mvn -B -ntp clean compile -Dspringgraph.version="$SG_VERSION" > build.log 2>&1; then
            cat build.log
            echo "::error::Expected the build to fail with SG001"
            exit 1
          fi
          grep "SG001: No static binding found for seed.Notifier" build.log
          rm -rf src/main/java/seed build.log

      - name: Advisory mode reports but does not fail
        working-directory: examples/maven-lombok
        run: |
          mvn -B -ntp --version | grep -q 'Java version: 17\.' || { echo "::error::Maven is not running on Java 17"; exit 1; }
          mkdir -p src/main/java/seed
          echo 'package seed; public interface Notifier {}' > src/main/java/seed/Notifier.java
          echo 'package seed; @org.springframework.stereotype.Service @lombok.RequiredArgsConstructor public class NotifyService { private final Notifier notifier; }' > src/main/java/seed/NotifyService.java
          mvn -B -ntp clean compile -Dspringgraph.version="$SG_VERSION" -Dsg.mode=advisory | tee build.log
          grep "WARNING.*SG001" build.log
          rm -rf src/main/java/seed build.log

  formatting:
    name: Formatting and license headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Java (palantir-java-format + Apache header), Gradle Kotlin scripts (ktlint), docs and config whitespace.
      # Fix locally with: ./gradlew spotlessApply
      - name: Spotless check
        run: ./gradlew spotlessCheck --console=plain
