name: IntelliJ plugin

# The plugin is a separate Gradle build (springgraph-intellij/) because it downloads an IDE (about 1.5 GB).
# It also runs when the processor's report snapshots change: the plugin tests parse them, so a report format change
# that the plugin cannot read fails here.
on:
  push:
    branches: [development]
    paths:
      - "springgraph-intellij/**"
      - "springgraph-processor/src/test/resources/snapshots/**"
      - "gradle/**"
      - ".github/workflows/intellij.yml"
  pull_request:
    paths:
      - "springgraph-intellij/**"
      - "springgraph-processor/src/test/resources/snapshots/**"
      - "gradle/**"
      - ".github/workflows/intellij.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellij-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Validates gradle-wrapper.jar and caches the downloaded IDE between runs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Tests (including the processor-snapshot contract), the plugin zip, plugin.xml/archive checks, and
      # JetBrains Plugin Verifier against the target IDE (platformVersion in springgraph-intellij/gradle.properties).
      - name: Build, test and verify
        run: ./gradlew -p springgraph-intellij build verifyPluginStructure verifyPlugin --console=plain

      # Install from disk: Settings | Plugins | gear icon | Install Plugin from Disk.
      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: springgraph-intellij
          path: springgraph-intellij/build/distributions/*.zip
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-reports
          path: |
            springgraph-intellij/build/reports/
            springgraph-intellij/build/test-results/
          retention-days: 7
