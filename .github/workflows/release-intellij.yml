name: Release IntelliJ plugin

# Push a signed tag matching the plugin version to release, e.g. pluginVersion=0.1.0 in
# springgraph-intellij/gradle.properties and `git tag -s intellij-v0.1.0`. Processor releases use `v*` tags
# (release.yml); the two never trigger each other.
#
# Same security model as release.yml (setup: docs/releasing.md, "IntelliJ plugin"):
# - Repository code (Gradle) runs only in `verify`, which has no secrets and a read-only token.
# - `verify` requires a tag signed by the maintainer key, on a commit of the release branch, and records the commit.
#   Every publishing job re-checks that the tag still points to it.
# - `verify` builds the plugin zip once. Later jobs check out nothing, check the zip against a checksum passed through
#   job outputs, and run only shell steps from this file plus JetBrains' signer CLI (pinned by SHA-256), curl and gh.
# - Secrets live in the `intellij-release` environment (deployment tag rule `intellij-v*`, required reviewer), separate
#   from the processor's `release` environment. Each secret is available to exactly one job.
on:
  push:
    tags: ["intellij-v*"]

permissions: {}

concurrency:
  group: release-intellij-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: development
  # JetBrains Marketplace ZIP Signer, from Maven Central. Same file as the GitHub release asset of that version.
  ZIP_SIGNER_URL: https://repo1.maven.org/maven2/org/jetbrains/marketplace-zip-signer-cli/0.1.45/marketplace-zip-signer-cli-0.1.45.jar
  ZIP_SIGNER_SHA256: fc48b8a4165907e8164fc2a1256ed0d0fe6f7b25acb33ac48660ab13e7f64bb8
  PLUGIN_XML_ID: io.github.mrsluffy.springgraph

jobs:
  verify:
    name: Verify, build, and stage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      checksum: ${{ steps.stage.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Explicitly refresh the release branch and the annotated tag object (checkout can store tags as lightweight).
      # The read-only token is passed for this command only and is not persisted.
      - name: Fetch release branch and tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch --no-tags --force origin \
            "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}" \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Tag must be annotated and point to the triggering commit
        id: tag
        run: |
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag. Release tags must be signed: git tag -s ${GITHUB_REF_NAME}"
            exit 1
          fi
          commit=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} now points to ${commit}, but this run was started for ${GITHUB_SHA}."
            exit 1
          fi
          echo "sha=${commit}" >> "$GITHUB_OUTPUT"

      # Policy: any commit that is already on the release branch may be released (not only the branch head).
      - name: Tag must point to a commit on the release branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on ${RELEASE_BRANCH}. Only reviewed commits can be released."
            exit 1
          fi

      # The same repository variables as processor releases: the maintainer's armored public key and its primary key
      # fingerprint. The tag must carry a good signature from exactly that primary key.
      - name: Tag must be signed by the release maintainer key
        env:
          TAG_SIGNER_KEY: ${{ vars.RELEASE_TAG_SIGNER_KEY }}
          TAG_SIGNER_FINGERPRINT: ${{ vars.RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: |
          if [ -z "$TAG_SIGNER_KEY" ] || [ -z "$TAG_SIGNER_FINGERPRINT" ]; then
            echo "::error::Repository variables RELEASE_TAG_SIGNER_KEY and RELEASE_TAG_SIGNER_FINGERPRINT are required. See docs/releasing.md."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$TAG_SIGNER_KEY" | gpg --batch --quiet --import
          expected=$(printf '%s' "$TAG_SIGNER_FINGERPRINT" | tr -d ' ' | tr '[:lower:]' '[:upper:]')
          if ! status=$(git verify-tag --raw "$GITHUB_REF_NAME" 2>&1); then
            echo "$status"
            echo "::error::${GITHUB_REF_NAME} does not have a valid signature."
            exit 1
          fi
          # GOODSIG excludes expired and revoked keys. VALIDSIG: $3 is the signing (sub)key, the optional $12 the primary.
          primary=$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print (NF >= 12 ? $12 : $3) }' <<<"$status")
          if ! grep -Fq '[GNUPG:] GOODSIG ' <<<"$status" || [ "$primary" != "$expected" ]; then
            echo "$status"
            echo "::error::${GITHUB_REF_NAME} is signed by '${primary}', expected '${expected}'."
            exit 1
          fi
          echo "Tag signed by ${primary}"

      # Read from the file, not by running Gradle, so a build script cannot influence the version check.
      - name: Tag must match the plugin version
        id: version
        run: |
          version=$(sed -n 's/^pluginVersion=//p' springgraph-intellij/gradle.properties | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::pluginVersion '${version}' in springgraph-intellij/gradle.properties is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [ "intellij-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pluginVersion ${version} (expected intellij-v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Tests (including the processor-snapshot contract and the bundled processor), plugin.xml and archive checks,
      # and JetBrains Plugin Verifier against the target IDE. The bundled processor's SHA-256 is checked by the build.
      - name: Build, test and verify
        run: ./gradlew -p springgraph-intellij build buildPlugin verifyPluginStructure verifyPlugin --console=plain

      - name: Stage plugin
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="springgraph-intellij/build/distributions/springgraph-intellij-${VERSION}.zip"
          [ -f "$zip" ] || { echo "::error::missing ${zip}"; exit 1; }
          mkdir -p release
          cp "$zip" "release/springgraph-intellij-${VERSION}-unsigned.zip"
          echo "checksum=$(sha256sum "release/springgraph-intellij-${VERSION}-unsigned.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-unsigned
          path: release/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: intellij-release
    permissions: {}
    outputs:
      checksums: ${{ steps.sign.outputs.checksums }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-unsigned
          path: release

      # Job outputs come from `verify`, which ran repository code (Gradle). Re-validate them before they reach a shell
      # or curl argument here, where secrets are present.
      - name: Check job outputs
        env:
          EXPECTED: ${{ needs.verify.outputs.checksum }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "::error::unexpected version output"; exit 1; }
          [ "intellij-v${VERSION}" = "$GITHUB_REF_NAME" ] || { echo "::error::version output does not match the tag"; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected checksum output"; exit 1; }

      - name: Verify staged plugin
        env:
          EXPECTED: ${{ needs.verify.outputs.checksum }}
        working-directory: release
        run: |
          echo "${EXPECTED}  springgraph-intellij-${VERSION}-unsigned.zip" | sha256sum --check --strict -
          # Sign only this plugin at this version: its descriptor must name the expected ID and version. Read with
          # unzip, not by running anything from the archive.
          jar=$(unzip -Z1 "springgraph-intellij-${VERSION}-unsigned.zip" | grep -E '^springgraph-intellij/lib/springgraph-intellij-[^/]+\.jar$')
          [ "$(printf '%s\n' "$jar" | wc -l)" -eq 1 ] || { echo "::error::expected exactly one plugin jar, found: ${jar}"; exit 1; }
          unzip -p "springgraph-intellij-${VERSION}-unsigned.zip" "$jar" > "$RUNNER_TEMP/plugin.jar"
          descriptor=$(unzip -p "$RUNNER_TEMP/plugin.jar" META-INF/plugin.xml)
          rm -f "$RUNNER_TEMP/plugin.jar"
          id=$(sed -n 's:.*<id>\([^<]*\)</id>.*:\1:p' <<<"$descriptor" | head -n1)
          version=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' <<<"$descriptor" | head -n1)
          if [ "$id" != "$PLUGIN_XML_ID" ] || [ "$version" != "$VERSION" ]; then
            echo "::error::plugin.xml declares id '${id}' version '${version}', expected '${PLUGIN_XML_ID}' '${VERSION}'."
            exit 1
          fi
          echo "plugin.xml: ${id} ${version}"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Download the signer
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zip-signer.jar" "$ZIP_SIGNER_URL"
          echo "${ZIP_SIGNER_SHA256}  $RUNNER_TEMP/zip-signer.jar" | sha256sum --check --strict -

      # Marketplace requires author-signed plugins. Generate the key and certificate chain as in
      # https://plugins.jetbrains.com/docs/intellij/plugin-signing.html (docs/releasing.md has the commands).
      - name: Sign and verify
        id: sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.INTELLIJ_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.INTELLIJ_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.INTELLIJ_PRIVATE_KEY_PASSWORD }}
        working-directory: release
        run: |
          if [ -z "$CERTIFICATE_CHAIN" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::INTELLIJ_CERTIFICATE_CHAIN and INTELLIJ_PRIVATE_KEY are required in the intellij-release environment. See docs/releasing.md."
            exit 1
          fi
          keys="$(mktemp -d)"
          chmod 700 "$keys"
          # Remove the key even when signing fails.
          trap 'rm -rf "$keys"' EXIT
          ( umask 077; printf '%s\n' "$PRIVATE_KEY" > "$keys/private.pem" )
          printf '%s\n' "$CERTIFICATE_CHAIN" > "$keys/chain.crt"
          # The signer takes the key password only as an argument. It is optional: JetBrains' instructions produce an
          # unencrypted private.pem, which is then protected as a secret instead.
          pass=()
          if [ -n "$PRIVATE_KEY_PASSWORD" ]; then
            pass=(-key-pass "$PRIVATE_KEY_PASSWORD")
          fi
          java -jar "$RUNNER_TEMP/zip-signer.jar" sign \
            -in "springgraph-intellij-${VERSION}-unsigned.zip" \
            -out "springgraph-intellij-${VERSION}.zip" \
            -cert-file "$keys/chain.crt" -key-file "$keys/private.pem" "${pass[@]}"
          # verify takes the certificate file as -cert (sign uses -cert-file).
          java -jar "$RUNNER_TEMP/zip-signer.jar" verify \
            -in "springgraph-intellij-${VERSION}.zip" -cert "$keys/chain.crt"
          # The certificate chain is public; it is attached to the GitHub Release for verifying the zip.
          cp "$keys/chain.crt" "springgraph-intellij-${VERSION}.crt"
          rm -rf "$keys"
          rm "springgraph-intellij-${VERSION}-unsigned.zip"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          echo "checksums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-signed
          path: release/
          if-no-files-found: error
          retention-days: 7

  marketplace:
    name: Publish to JetBrains Marketplace
    needs: [verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: intellij-release
    permissions:
      contents: read # only to re-check the tag through the API
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Check Marketplace configuration
        id: configured
        env:
          TOKEN: ${{ secrets.INTELLIJ_MARKETPLACE_TOKEN }}
          CHECKSUMS: ${{ needs.sign.outputs.checksums }}
        run: |
          # Re-validate the job outputs before they reach curl, where the token is present.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "::error::unexpected version output"; exit 1; }
          [ "intellij-v${VERSION}" = "$GITHUB_REF_NAME" ] || { echo "::error::version output does not match the tag"; exit 1; }
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit output"; exit 1; }
          [[ "$CHECKSUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected checksum output"; exit 1; }
          if [ -z "$TOKEN" ]; then
            # Marketplace only accepts uploads through the API after the first version was uploaded by hand.
            echo "::notice::INTELLIJ_MARKETPLACE_TOKEN is not configured; skipping Marketplace. Upload the signed zip from the GitHub Release by hand."
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.configured.outputs.value == 'true'
        with:
          name: plugin-signed
          path: release

      - name: Verify signed plugin
        if: steps.configured.outputs.value == 'true'
        env:
          EXPECTED: ${{ needs.sign.outputs.checksums }}
        working-directory: release
        run: |
          echo "${EXPECTED}  SHA256SUMS" | sha256sum --check --strict -
          sha256sum --check --strict SHA256SUMS

      # Same check in every publishing job: publish only if the tag still points to the commit verify built.
      - name: Tag must still point to the verified commit
        if: steps.configured.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
                --jq '.object.type + " " + .object.sha'); then
            echo "::error::Could not look up ${GITHUB_REF_NAME} through the GitHub API."
            exit 1
          fi
          read -r type sha <<<"$ref"
          if [ "$type" = "tag" ]; then
            if ! sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha'); then
              echo "::error::Could not resolve the annotated tag ${GITHUB_REF_NAME}."
              exit 1
            fi
          elif [ "$type" != "commit" ]; then
            echo "::error::${GITHUB_REF_NAME} points to an unexpected object type: '${type}'."
            exit 1
          fi
          if [ "$sha" != "$VERIFIED_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} now points to '${sha}'; the plugin was built from ${VERIFIED_SHA}."
            exit 1
          fi

      # API: https://plugins.jetbrains.com/docs/marketplace/plugin-upload.html. Pre-release versions (1.2.3-beta.1)
      # go to the `eap` channel; others to the default (stable) channel. Marketplace then reviews the update.
      - name: Upload
        if: steps.configured.outputs.value == 'true'
        env:
          TOKEN: ${{ secrets.INTELLIJ_MARKETPLACE_TOKEN }}
        working-directory: release
        run: |
          channel=""
          case "$VERSION" in *-*) channel="eap" ;; esac
          # The token goes through a header file, not the command line.
          headers="$(mktemp)"
          chmod 600 "$headers"
          printf 'Authorization: Bearer %s\n' "$TOKEN" > "$headers"
          # No --retry: the upload is not idempotent. A retried POST after a lost response would be rejected as a
          # duplicate version even though the first one succeeded.
          status=$(curl -sS --max-time 600 -o response.txt -w '%{http_code}' \
            -H "@${headers}" \
            -F "xmlId=${PLUGIN_XML_ID}" \
            -F "file=@springgraph-intellij-${VERSION}.zip" \
            -F "channel=${channel}" \
            https://plugins.jetbrains.com/api/updates/upload)
          rm -f "$headers"
          echo "HTTP ${status}"
          # The response is external text: stop the runner from reading workflow commands (::...::) in it.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::${stop}"
          head -c 2000 response.txt; echo
          echo "::${stop}::"
          rm -f response.txt
          case "$status" in
            2??) echo "Uploaded ${VERSION} (channel: ${channel:-stable}). Marketplace reviews it before it is public." ;;
            404) echo "::error::Marketplace does not know ${PLUGIN_XML_ID} yet: upload the first version by hand (docs/releasing.md)."; exit 1 ;;
            *) echo "::error::Marketplace upload failed with HTTP ${status}."; exit 1 ;;
          esac

  github-release:
    name: Create GitHub Release
    needs: [verify, sign, marketplace]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-signed
          path: release

      - name: Verify signed plugin
        env:
          EXPECTED: ${{ needs.sign.outputs.checksums }}
        working-directory: release
        run: |
          # Re-validate the job outputs before they reach gh, which holds a contents: write token.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || { echo "::error::unexpected version output"; exit 1; }
          [ "intellij-v${VERSION}" = "$GITHUB_REF_NAME" ] || { echo "::error::version output does not match the tag"; exit 1; }
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit output"; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected checksum output"; exit 1; }
          echo "${EXPECTED}  SHA256SUMS" | sha256sum --check --strict -
          sha256sum --check --strict SHA256SUMS

      - name: Tag must still point to the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
                --jq '.object.type + " " + .object.sha'); then
            echo "::error::Could not look up ${GITHUB_REF_NAME} through the GitHub API."
            exit 1
          fi
          read -r type sha <<<"$ref"
          if [ "$type" = "tag" ]; then
            if ! sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha'); then
              echo "::error::Could not resolve the annotated tag ${GITHUB_REF_NAME}."
              exit 1
            fi
          elif [ "$type" != "commit" ]; then
            echo "::error::${GITHUB_REF_NAME} points to an unexpected object type: '${type}'."
            exit 1
          fi
          if [ "$sha" != "$VERIFIED_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} now points to '${sha}'; the plugin was built from ${VERIFIED_SHA}."
            exit 1
          fi

      # Fixed notes, not --generate-notes: generated notes list every PR since the previous tag of either product.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          SpringGraph IntelliJ plugin ${VERSION} (experimental).

          - Install: Settings | Plugins | Marketplace, search for SpringGraph (after JetBrains' review), or Settings |
            Plugins | gear icon | Install Plugin from Disk with \`springgraph-intellij-${VERSION}.zip\`.
          - The zip is signed; \`springgraph-intellij-${VERSION}.crt\` is the signing certificate chain and
            \`SHA256SUMS\` lists the checksums.
          - Documentation: https://mrsluffy.github.io/spring-graph/intellij/
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SpringGraph IntelliJ plugin ${VERSION}" \
            --notes-file notes.md \
            $prerelease \
            release/*
