# Keeps the commit-pinned actions and the build dependencies current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: maven
    directory: /examples/maven-lombok
    schedule:
      interval: monthly
