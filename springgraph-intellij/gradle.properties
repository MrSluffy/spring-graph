# Plugin version, released independently of the processor.
pluginVersion=0.1.0
# Build against the oldest supported IDE (JetBrains' recommendation); newer IDEs are covered by an open-ended until-build.
# 2025.3 is branch 253 and runs on Java 21; 2026.2 needs Java 25.
platformVersion=2025.3
pluginSinceBuild=253

# The processor bundled in the plugin for IDE analysis: a published release from Maven Central, verified against this
# SHA-256 at build time, then shipped inside the plugin (no download at runtime). To update: change both lines;
# the hash is the one of the .jar on repo1.maven.org (check its .asc signature with the release key first).
bundledProcessorVersion=0.1.0-rc.4
bundledProcessorSha256=4718065976822199d9b3ed752f2cc0e1d0d42d441901ee7cfa012d93e138acef

org.gradle.jvmargs=-Xmx2g
# The IntelliJ Platform artifacts are large; keep the configuration cache off until the plugin build supports it fully.
org.gradle.configuration-cache=false
